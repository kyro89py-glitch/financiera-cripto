# Servidor completo con HTTPS automático (Caddy obtiene y renueva el certificado).
# Uso: copia .env.example a .env, complétalo y ejecuta: docker compose up -d
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - datos:/datos

  # Tareas de fondo: precios y correos cada 5 minutos; el día 1 de cada mes, la comisión del mes anterior
  # (es idempotente: repetirla no cobra dos veces).
  tareas:
    build: .
    restart: unless-stopped
    env_file: .env
    volumes:
      - datos:/datos
    entrypoint:
      - sh
      - -c
      - |
        while true; do
          flask --app financiera actualizar-precios || true
          flask --app financiera enviar-correos || true
          if [ "$$(date +%d)" = "01" ]; then flask --app financiera cobrar-comisiones || true; fi
          sleep 300
        done

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMINIO: ${DOMINIO}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_datos:/data
    depends_on:
      - app

volumes:
  datos:
  caddy_datos:
