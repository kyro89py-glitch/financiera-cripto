{% extends "base.html" %}
{% block titulo %}Código de verificación{% endblock %}
{% block contenido %}
<div class="auth">
  <div>
    <h2>Código de verificación</h2>
    <p class="muted">Escribe el código de 6 dígitos que muestra tu aplicación de autenticación.</p>
  </div>
  {% if error %}<div class="flash error" role="alert">{{ error }}</div>{% endif %}
  <form class="card col" method="post" action="{{ url_for('auth.codigo') }}">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label class="field" for="codigo">Código
      <input id="codigo" name="codigo" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9 ]{6,7}" maxlength="7" required autofocus>
    </label>
    <button class="btn primary block" type="submit">Verificar</button>
  </form>
  <a class="small" href="{{ url_for('auth.ingresar') }}">Volver a empezar</a>
</div>
{% endblock %}
